<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>지유이엔지</title>
<style>
:root {
  --paper: oklch(1 0 0);
  --ink: oklch(0.184 0.042 260.2);
  --safety: oklch(0.715 0.167 55.4);
  --muted: oklch(0.45 0.02 260);
  --line: oklch(0.92 0.005 260);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
  display: grid;
  place-items: center;
  padding: 24px;
  word-break: keep-all;
  line-height: 1.6;
}
main { max-width: 34em; text-align: center; }
.wordmark { width: 180px; height: auto; margin: 0 auto 40px; display: block; }
.badge {
  display: inline-block;
  font-size: 0.8125rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--safety);
  border: 1px solid currentColor;
  border-radius: 999px;
  padding: 4px 14px;
  margin-bottom: 20px;
}
h1 { font-size: clamp(1.5rem, 1.2rem + 1.5vw, 2.125rem); font-weight: 700; line-height: 1.35; margin-bottom: 16px; }
.lede { font-size: 1.0625rem; color: var(--muted); margin-bottom: 44px; }
.contact {
  border-top: 1px solid var(--line);
  padding-top: 28px;
  font-size: 0.9375rem;
  font-style: normal;
  color: var(--muted);
  display: grid;
  gap: 6px;
}
.contact a { color: var(--ink); text-decoration: none; font-weight: 600; }
.contact a:hover, .contact a:focus-visible { text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  :root {
    --paper: oklch(0.184 0.042 260.2);
    --ink: oklch(0.97 0.005 260);
    --muted: oklch(0.72 0.015 260);
    --line: oklch(0.32 0.03 260);
  }
}
</style>
</head>
<body>
<main>
  <img class="wordmark" src="/brand/jiyou-wordmark.svg" alt="지유이엔지" width="1606" height="514">
  <p class="badge">홈페이지 리뉴얼</p>
  <h1>홈페이지를 새로 단장하고 있습니다.</h1>
  <p class="lede">더 나은 모습으로 찾아뵙기 위해 잠시 문을 닫았습니다.<br>제품과 도입 문의는 아래 연락처로 부탁드립니다.</p>
  <address class="contact">
    <span>전화 <a href="tel:0319912285">031-991-2285</a></span>
    <span>이메일 <a href="mailto:jiyou_eng@naver.com">jiyou_eng@naver.com</a></span>
    <span>경기 김포시 양촌읍 석모로45번길 93-1</span>
  </address>
</main>
</body>
</html>
