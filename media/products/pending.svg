  <rect x="360" y="268" width="480" height="139" rx="8" fill="#101D3A" stroke="#2CCFC3" stroke-width="2"/>
  <text x="600" y="326" fill="#F8FAFC" font-family="sans-serif" font-size="30" font-weight="700" text-anchor="middle">이미지 승인 대기</text>
  <text x="600" y="366" fill="#D0D5DD" font-family="sans-serif" font-size="18" text-anchor="middle">공개 승인 후 실제 제품 또는 현장 이미지로 교체됩니다</text>
